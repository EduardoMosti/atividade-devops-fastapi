name: Pipeline DevOps FastAPI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

jobs:
  build-test:
    name: Validar aplicacao Python
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          pip install -r requirements.txt

      - name: Validar sintaxe com flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Executar testes automatizados
        run: |
          PYTHONPATH=. pytest tests/ -v --tb=short

  docker-build:
    name: Validar build da imagem Docker
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Construir imagem Docker local
        run: |
          docker build -t atividade-devops-fastapi .